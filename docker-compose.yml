services:
  mongo:
    image: mongo:7-jammy
    container_name: skillvault-database
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skillvault-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillvault-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - mongo_url=${MONGO_URL:-mongodb://mongo:27017/skillvault}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - skillvault-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client/skillvault
      dockerfile: Dockerfile
    container_name: skillvault-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillvault-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    name: skillvault-mongo-data

networks:
  skillvault-network:
    name: skillvault-network
    driver: bridge
